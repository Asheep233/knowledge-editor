[package]
name = "uiws-s1-probe"
version = "0.0.1"
description = "UI Workshop P0-S1 probe: sandbox iframe + MessagePort + ACL/recovery experiments"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
strip = true
