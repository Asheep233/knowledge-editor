# KnowledgeEditor CI
# 触发：push 到默认分支 master（P1-16: 原 branches:main 不会触发）+ PR。
# 覆盖：Linux(backend pytest + frontend) / Windows(backend pytest + frontend) / Desktop(cargo test + tauri build)。
# 注：test_delete_safety.py 的 Windows 路径语义 skipif 由 backend 子代理负责，Windows pytest 需在其落地后全绿。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend (vitest + build, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Type check & build
        working-directory: frontend
        run: npm run build

  # Windows 等价验证：后端会在 Windows 上运行，必须覆盖（P1-16）。
  windows:
    name: Windows (pytest + vitest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Frontend build (ke-vite platform-aware esbuild)
        working-directory: frontend
        run: npm run build

  # Desktop：Rust 侧车从源码可复现构建 + cargo test + tauri build。
  # 侧车由 PyInstaller spec 产出；tauri build 本地需 MSVC/NSIS，故整 job 允许失败（P1-16 注明）。
  desktop:
    name: Desktop (sidecar from source + cargo + tauri)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # 侧车可复现构建：backend + PyInstaller spec（在仓库根执行以匹配 spec 的 pathex=['backend']）。
      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Build sidecar from source (PyInstaller)
        run: |
          python -m PyInstaller backend/knowledgeeditor-backend.spec --distpath desktop/src-tauri/binaries --workpath backend/build/pyinstaller --noconfirm --clean
          # 目标文件名需带 triple 后缀（externalBin 约定）
          Move-Item -Force desktop/src-tauri/binaries/knowledgeeditor-backend.exe desktop/src-tauri/binaries/knowledgeeditor-backend-x86_64-pc-windows-msvc.exe
          Get-ChildItem desktop/src-tauri/binaries/knowledgeeditor-backend-*.exe | Select-Object Name,Length
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend dist (for hash manifest)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Hash manifest (sidecar + frontend dist) + version consistency check
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE"
          $binDir = Join-Path $root 'desktop\src-tauri\binaries'
          $distDir = Join-Path $root 'frontend\dist-build'
          $manifest = [ordered]@{ schemaVersion = 1; built_at = (Get-Date).ToString('o'); artifacts = @() }
          $sumLines = @()
          Get-ChildItem $binDir -Filter 'knowledgeeditor-backend-*.exe' -ErrorAction SilentlyContinue | ForEach-Object {
            $h = $_ | Get-FileHash -Algorithm SHA256
            $rel = $_.FullName.Substring($root.Length + 1)
            $manifest.artifacts += [ordered]@{ path = $rel; size = $_.Length; sha256 = $h.Hash.ToLowerInvariant() }
            $sumLines += "$($h.Hash.ToLowerInvariant())  $rel"
          }
          if (Test-Path $distDir) {
            Get-ChildItem $distDir -Recurse -File | ForEach-Object {
              $h = $_ | Get-FileHash -Algorithm SHA256
              $rel = $_.FullName.Substring($root.Length + 1)
              $manifest.artifacts += [ordered]@{ path = $rel; size = $_.Length; sha256 = $h.Hash.ToLowerInvariant() }
              $sumLines += "$($h.Hash.ToLowerInvariant())  $rel"
            }
          }
          $out = Join-Path $binDir 'versions.json'
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path $out -Encoding UTF8
          $sumOut = Join-Path $binDir 'manifest.sha256'
          $sumLines | Set-Content -Path $sumOut -Encoding ASCII
          Write-Host "==> hash manifest written: $out + $sumOut"
          # P1-16：sidecar 版本一致性 = 运行时校验（字节扫描对 PyInstaller 压缩 PYZ 无效）：
          # 以临时端口拉起 exe → 查询 /api/health 的 version → 与 backend __version__ 比对 → 杀进程树。
          $exe = Get-ChildItem $binDir -Filter 'knowledgeeditor-backend-*.exe' | Select-Object -First 1
          if ($exe) {
            $version = (python -c "import sys; sys.path.insert(0, 'backend'); from app import __version__; print(__version__)").Trim()
            $port = Get-Random -Minimum 20000 -Maximum 50000
            $env:KE_PORT = "$port"
            $proc = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden
            try {
              $versionFromExe = $null
              for ($i = 0; $i -lt 60; $i++) {
                Start-Sleep -Milliseconds 1000
                $body = curl.exe -s "http://127.0.0.1:$port/api/health" --max-time 3
                if ($body) { try { $versionFromExe = ($body | ConvertFrom-Json).version } catch { } }
                if ($versionFromExe) { break }
                if ($proc.HasExited) { break }
              }
              if (-not $versionFromExe) { throw "sidecar exe 未能返回 health（进程已退出或超时）" }
              if ($versionFromExe -ne $version) { throw "sidecar exe 版本 '$versionFromExe' 与源码 '$version' 不一致（源码与产物漂移）" }
              Write-Host "==> [P1-16] sidecar exe 运行时版本与源码一致: $version"
            }
            finally {
              & taskkill /PID $proc.Id /T /F 2>$null | Out-Null
              Remove-Item Env:\KE_PORT -ErrorAction SilentlyContinue
            }
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust build & test
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Tauri dist build (NSIS)
        working-directory: desktop
        run: |
          npm ci
          npm run build
      # P4-6：如需签名安装包，注入 Authenticode 证书后设置以下环境变量即可
      # （get-filehash/signtool 调用见 desktop/KNOWLEDGEEDITOR_BACKEND.md）。
      - name: Upload versions.json + installer (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            desktop/src-tauri/binaries/versions.json
            desktop/src-tauri/binaries/manifest.sha256
            desktop/src-tauri/binaries/knowledgeeditor-backend-x86_64-pc-windows-msvc.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
